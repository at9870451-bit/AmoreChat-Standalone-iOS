name: Standalone SwiftUI iOS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer || true
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build for iOS Simulator
        run: xcodebuild -project AmoreChatStandalone.xcodeproj -scheme AmoreChatStandalone -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run unit and UI tests
        run: xcodebuild -project AmoreChatStandalone.xcodeproj -scheme AmoreChatStandalone -destination 'platform=iOS Simulator,name=iPhone 17' -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/AmoreChatScreens.xcresult" CODE_SIGNING_ALLOWED=NO test
      - name: Export UI screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d "$RUNNER_TEMP/AmoreChatScreens.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/AmoreChatScreens.xcresult" --output-path screenshots || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-ui-screenshots
          path: screenshots/
          if-no-files-found: warn
      - name: Build iOS device archive
        run: xcodebuild -project AmoreChatStandalone.xcodeproj -scheme AmoreChatStandalone -configuration Release -derivedDataPath "$RUNNER_TEMP/amorechat-device" -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          ditto "$RUNNER_TEMP/amorechat-device/Build/Products/Release-iphoneos/AmoreChatStandalone.app" Payload/AmoreChatStandalone.app
          zip -qry AmoreChat-Standalone-0.1.0-unsigned.ipa Payload
          unzip -tq AmoreChat-Standalone-0.1.0-unsigned.ipa
          shasum -a 256 AmoreChat-Standalone-0.1.0-unsigned.ipa > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-ios-unsigned
          path: |
            AmoreChat-Standalone-0.1.0-unsigned.ipa
            SHA256.txt
          if-no-files-found: error
          retention-days: 30
