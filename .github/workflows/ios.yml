name: Standalone iOS Device Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer || true
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build iOS device archive
        run: xcodebuild -project AmoreChatStandalone.xcodeproj -scheme AmoreChatStandalone -configuration Release -derivedDataPath "$RUNNER_TEMP/amorechat-device" -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          ditto "$RUNNER_TEMP/amorechat-device/Build/Products/Release-iphoneos/AmoreChatStandalone.app" Payload/AmoreChatStandalone.app
          zip -qry AmoreChat-Standalone-0.5.0-unsigned.ipa Payload
          unzip -tq AmoreChat-Standalone-0.5.0-unsigned.ipa
          shasum -a 256 AmoreChat-Standalone-0.5.0-unsigned.ipa > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-ios-unsigned
          path: |
            AmoreChat-Standalone-0.5.0-unsigned.ipa
            SHA256.txt
          if-no-files-found: error
          retention-days: 30
